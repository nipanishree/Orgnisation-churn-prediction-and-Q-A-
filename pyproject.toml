[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction-qa"
version = "0.1.0"
description = "End-to-end Customer Churn Prediction and RAG Q&A System"
readme = "README.md"
requires-python = ">=3.11,<3.13"

authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

dependencies = [
    # Data Science
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-dotenv>=1.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # RAG / LLM
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "transformers>=4.40",
]

[project.optional-dependencies]

dev = [
    # Testing
    "pytest>=8.0",
    "pytest-cov>=5.0",

    # Code quality
    "ruff>=0.6",

    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

ml = [
    # Optional ML libraries
    "xgboost>=2.0",
    "lightgbm>=4.0",
]

tracking = [
    "mlflow>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]